unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g mouse off
set -g history-limit 200000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
# C-l is taken by pane navigation
bind C-l send-keys C-l

bind P command-prompt -p "project dir:" "run-shell '$HOME/dotfiles/tmux/new-project.sh \"%%\"'"

# palette: coolors.co/64f58d-08b2e3-f0b67f-e3d8f1-ec058e
set -g status-interval 5
set -g status-style "bg=default,fg=#e3d8f1"
set -g status-left "#[bg=#64f58d,fg=black,bold] #S #[default]  "
set -g status-left-length 30
set -g status-right "#[fg=#f0b67f] #(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#e3d8f1] %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=#e3d8f1"
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#08b2e3,fg=black,bold"
setw -g window-status-activity-style "fg=#ec058e,bold"
set -g pane-border-style "fg=#e3d8f1,dim"
set -g pane-active-border-style "fg=#ec058e"
set -g message-style "bg=#ec058e,fg=black,bold"
set -g message-command-style "bg=#08b2e3,fg=black"
setw -g mode-style "bg=#ec058e,fg=black"
set -g display-panes-active-colour "#ec058e"
set -g display-panes-colour "#08b2e3"
setw -g clock-mode-colour "#64f58d"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-processes '"~claude->claude --continue"'
run '~/.tmux/plugins/tpm/tpm'
